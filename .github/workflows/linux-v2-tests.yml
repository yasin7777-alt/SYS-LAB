name: Linux Terminal 2.0 tests

on:
  push:
    branches:
      - feature/linux-terminal-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Test virtual Linux shell
        run: node --experimental-strip-types --test src/lib/linux/terminal.test.ts
